<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Рецепт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/recipe.css">
</head>
<body>
    <a href="./index.html" class="back-link">← Назад к каталогу</a>
    <div id="recipe-container">Загрузка...</div>
    <button type="button" id="favoriteBtn" hidden>В избранное</button>

    <section id="reviews-section">
        <h2>Отзывы</h2>

        <form id="reviewForm" class="review-form" hidden>
            <textarea
                id="reviewText"
                rows="4"
                placeholder="Напишите ваш отзыв о рецепте"></textarea>
            <button type="submit" id="reviewSubmit">Отправить отзыв</button>
        </form>

        <p id="reviewGuestMessage" hidden>
            Чтобы оставить отзыв, <a href="./login.html">войдите</a>
            или <a href="./registration.html">зарегистрируйтесь</a>.
        </p>

        <div id="reviewsContainer">Загрузка отзывов...</div>
    </section>

    <script type="module" src="./js/recipe.js"></script>
</body>
</html>
