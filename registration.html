<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="registrationForm" class="registration-form" action="">
        <input id="username" class="registration-input" type="text" placeholder="Введите имя">
        <input id="email" class="registration-input" type="email" placeholder="Введите email">
        <input id="password" class="registration-input" type="password" placeholder="Введите пароль">
        <input id="confirmPassword" class="registration-input" type="password" placeholder="Подтвердите пароль">
        <button id="registrationButton" class="registration-button">Registration</button>
    </form>
</body>

<script type="module" src="./js/register.js"></script>
</html>
