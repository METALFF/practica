<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
    <a href="./index.html" class="back-link">← На главную</a>

    <div id="accessDenied" hidden>
        <p>Доступ только для администраторов.</p>
    </div>

    <div id="adminPanel" class="admin-panel" hidden>
        <h1>Админ-панель</h1>

        <section id="recipe-form-section" class="admin-card">
            <h2 id="formTitle">Добавить рецепт</h2>
            <form id="recipeForm" class="admin-form">
                <input type="hidden" id="recipeDocId">

                <input type="text" id="recipeTitle" placeholder="Название" required>

                <select id="recipeCategory" required>
                    <option value="" disabled selected>Категория</option>
                    <option value="Завтраки">Завтраки</option>
                    <option value="Обеды">Обеды</option>
                    <option value="Ужины">Ужины</option>
                    <option value="Десерты">Десерты</option>
                </select>

                <input type="url" id="recipeImage" placeholder="Ссылка на изображение" required>

                <textarea id="recipeIngredients" placeholder="Ингредиенты, каждый с новой строки" required></textarea>

                <textarea id="recipeInstructions" placeholder="Инструкции приготовления" required></textarea>

                <div class="admin-form-actions">
                    <button type="submit" id="recipeSubmitBtn">Добавить</button>
                    <button type="button" id="recipeCancelBtn" class="btn-secondary" hidden>Отмена</button>
                </div>
            </form>
        </section>

        <section id="recipes-admin-section" class="admin-card">
            <h2>Рецепты</h2>
            <div id="adminRecipesList" class="admin-list">Загрузка...</div>
        </section>

        <section id="comments-admin-section" class="admin-card">
            <h2>Модерация отзывов</h2>
            <div id="adminCommentsList" class="admin-list">Загрузка...</div>
        </section>

        <section id="users-admin-section" class="admin-card">
            <h2>Пользователи</h2>
            <div id="adminUsersList" class="admin-list">Загрузка...</div>
        </section>
    </div>

    <script type="module" src="./js/admin.js"></script>
</body>
</html>
