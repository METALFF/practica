<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/profile.css">
</head>
<body>
    <div class="profile-topbar">
        <a href="./index.html" class="back-link">← На главную</a>
        <button id="logoutButton" class="logout-btn">Выйти</button>
    </div>

    <section id="profile-section">
        <h1>Мой профиль</h1>
        <form id="profileForm">
            <input type="text" id="profileUsername" placeholder="Имя">
            <input type="text" id="profileEmail" disabled>
            <button type="submit">Сохранить</button>
        </form>
    </section>

    <section id="history-section">
        <h2>Мои отзывы</h2>
        <div id="myReviewsList">Загрузка...</div>
    </section>
    <a href="./admin.html" id="adminLink" class="admin-link" hidden>Админ-панель</a>

    <script type="module" src="./js/profile.js"></script>
</body>
</html>
